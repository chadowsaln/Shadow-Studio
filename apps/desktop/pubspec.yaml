name: desktop
description: Shadow Studio desktop video editor (Linux & Windows).
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.0
  collection: ^1.19.0
  editing_core: any
  local_storage: any
  media_core: any
  shadow_agent_runtime:
    path: ../../packages/agent_runtime
  shadow_contracts:
    path: ../../packages/contracts
  shadow_provider_gateway:
    path: ../../packages/provider_gateway
  shadow_tool_system:
    path: ../../packages/tool_system
  shadow_permissions:
    path: ../../packages/permissions

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
